<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lidscape Screen Saver</title>
  <style>
    @font-face { font-family: "Instrument Serif"; src: url("./instrument-serif-italic.woff2") format("woff2"); font-style: italic; font-weight: 400; font-display: swap; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b1622; }
    canvas { display: block; width: 100%; height: 100%; }
    #error:not([hidden]) { display: grid; }
    #label { position: fixed; left: 0; top: 0; display: grid; gap: 1px; padding: 6px 10px 7px; border: 1px solid #2c3838; border-radius: 6px; background: rgb(28 40 40 / 0.78); color: #f4f2ec; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); pointer-events: none; white-space: nowrap; box-sizing: border-box; }
    #label[hidden] { display: none; }
    #label strong { font: italic 400 19px/1.05 "Instrument Serif", Charter, Georgia, serif; }
    #label span { color: #a6adab; font-size: 12px; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="label" role="tooltip" hidden><strong></strong><span></span></div>
  <p id="error" role="alert" hidden style="position:fixed;inset:0;margin:0;place-items:center;background:#0b1622;color:#f4f2ec;font:16px system-ui;text-align:center;padding:2rem"></p>
  <script>
    const report = (message) => {
      const error = document.getElementById('error')
      error.textContent = message
      error.hidden = false
    }
    addEventListener('error', (event) => report(event.message || 'The screen saver could not load.'))
    addEventListener('unhandledrejection', (event) => report(String(event.reason)))
  </script>
  <script id="saver-main" src="./saver.js"></script>
  <script>document.getElementById('saver-main').addEventListener('error', () => report('The screen saver module could not load.'))</script>
</body>
</html>
