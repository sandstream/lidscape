name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install -g bun@1.3.10
      - run: bun install --frozen-lockfile
      - run: npx playwright install chromium
      - run: npm test
      - name: Check wallpaper ownership and acquire replies
        run: |
          sh wallpaper/tests/check-wallpaper-retirement-tickets.sh
          sh wallpaper/tests/check-wallpaper-state-handoff.sh
          sh wallpaper/tests/check-wallpaper-owner-invalidation.sh
          sh wallpaper/tests/check-wallpaper-handoff-owner-change.sh
          sh wallpaper/tests/check-wallpaper-acquire-cancellation.sh
      - run: node tools/check-cities.mjs
      - run: node tools/check-camera.mjs
      - run: node tools/check-lid.mjs
