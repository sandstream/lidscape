name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g bun@1.3.10
      - run: bun install --frozen-lockfile
      - run: npx playwright install chromium
      - run: npm test
      - run: node tools/check-cities.mjs
      - run: node tools/check-camera.mjs
      - run: node tools/check-lid.mjs
