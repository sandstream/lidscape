<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lidscape</title>
  <link rel="stylesheet" href="src/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <!-- In the Mac app the title bar is hidden; this strip moves the window. -->
  <div id="drag" data-tauri-drag-region></div>
  <div id="label" role="tooltip" hidden><strong></strong><span></span></div>
  <button id="map-toggle" type="button" aria-pressed="false"><span class="map-toggle-art" aria-hidden="true"></span><span class="map-toggle-text"></span></button>
  <aside id="map-info" hidden>
    <strong id="map-title"></strong>
    <span id="map-hint"></span>
    <div id="map-cities"></div>
    <div id="map-selection" hidden><strong id="map-selected"></strong><span id="map-selected-note"></span><div id="map-nearby"></div></div>
    <div id="map-zoom" role="group"><button id="map-zoom-out" type="button">−</button><output id="map-zoom-level">100 %</output><button id="map-zoom-in" type="button">+</button><button id="map-zoom-reset" type="button"></button></div>
    <span id="map-lid-status"></span>
    <label id="map-progress-label" for="map-progress"></label>
    <input id="map-progress" type="range" min="0" max="1" step="0.001" value="0">
    <select id="map-lang"></select>
    <a href="https://github.com/sandstream/lidscape/blob/main/CONTRIBUTING.md" target="_blank" rel="noopener"></a>
  </aside>

  <aside id="hud">
    <h1 id="hud-title"></h1>
    <div id="pickers">
      <select id="city"></select>
      <select id="theme"></select>
      <select id="variant"></select>
      <select id="lang"></select>
    </div>
    <div id="theme-settings"></div>
    <ul id="hud-status">
      <li data-source="lid"><span class="dot"></span><span class="label"></span></li>
      <li data-source="face"><span class="dot"></span><span class="label"></span></li>
      <li data-source="hand"><span class="dot"></span><span class="label"></span></li>
    </ul>
    <label id="progress-label" for="progress"></label>
    <input id="progress" type="range" min="0" max="1" step="0.001" value="0">
    <div id="hud-actions">
      <button id="camera-btn" type="button"></button>
      <button id="lights-btn" type="button"></button>
      <select id="camera" hidden></select>
      <button id="help-btn" type="button"></button>
    </div>
    <p id="hud-hint"></p>
    <p id="hud-update" role="status" hidden><span></span> <button type="button"></button> <button type="button"></button></p>
    <label id="update-check" hidden><input type="checkbox"> <span></span></label>
  </aside>

  <dialog id="howto">
    <h2></h2>
    <ul></ul>
    <section id="about">
      <h3></h3>
      <p class="about-text"></p>
      <p class="about-contribute"><span></span> <a href="https://github.com/sandstream/lidscape/blob/main/CONTRIBUTING.md" target="_blank" rel="noopener"></a></p>
      <p class="about-build"></p>
      <p><a class="about-source" href="https://github.com/sandstream/lidscape" target="_blank" rel="noopener"></a> <span class="about-version"></span></p>
    </section>
    <button type="button" autofocus></button>
  </dialog>

  <script type="module" src="src/main.js"></script>
</body>
</html>
